<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NOVA | AI Assistant</title>
    <meta name="theme-color" content="#0a0a0a">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --surface: #1a1a1a;
            --primary: #8b5cf6;
            --text: #e5e5e5;
            --text-muted: #a3a3a3;
            --user-msg: #2d3748;
            --nova-msg: #1e1e2f;
            
            --emotion-neutral: #8b5cf6;
            --emotion-happy: #10b981;
            --emotion-sad: #3b82f6;
            --emotion-stressed: #ef4444;
            --emotion-tired: #6366f1;
            --emotion-excited: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: rgba(26, 26, 26, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 10;
        }

        .logo {
            font-weight: 600;
            font-size: 1.2rem;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #10b981;
            box-shadow: 0 0 10px #10b981;
            transition: all 0.3s ease;
        }
        .status-dot.disconnected {
            background-color: #ef4444;
            box-shadow: 0 0 10px #ef4444;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.4;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease;
            position: relative;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            background-color: var(--user-msg);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.nova {
            background-color: var(--nova-msg);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border-left: 3px solid var(--emotion-neutral);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .message.nova[data-emotion="happy"] { border-left-color: var(--emotion-happy); }
        .message.nova[data-emotion="stressed"] { border-left-color: var(--emotion-stressed); }
        .message.nova[data-emotion="tired"] { border-left-color: var(--emotion-tired); }
        .message.nova[data-emotion="sad"] { border-left-color: var(--emotion-sad); }
        .message.nova[data-emotion="excited"] { border-left-color: var(--emotion-excited); }

        .feedback-actions {
            margin-top: 8px;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .feedback-btn {
            background: rgba(255,255,255,0.05);
            border: none;
            color: var(--text-muted);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .feedback-btn:hover, .feedback-btn.active {
            background: rgba(255,255,255,0.1);
            color: var(--primary);
        }

        .input-area {
            background-color: var(--surface);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        #message-input {
            flex: 1;
            background-color: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text);
            padding: 12px 16px;
            border-radius: 24px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        #message-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.1);
        }

        .action-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .action-btn.mic {
            background-color: transparent;
            color: var(--text-muted);
            box-shadow: none;
        }
        
        .action-btn.mic.listening {
            color: #ef4444;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); text-shadow: 0 0 10px #ef4444; }
            100% { transform: scale(1); }
        }

        /* Typing indicator */
        .typing {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background-color: var(--nova-msg);
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            align-self: flex-start;
            border-left: 3px solid var(--text-muted);
            display: none;
        }
        
        .typing span {
            width: 6px;
            height: 6px;
            background-color: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing span:nth-child(1) { animation-delay: -0.32s; }
        .typing span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-microchip" style="color: var(--primary)"></i> NOVA
        </div>
        <div class="status-dot" id="connection-status"></div>
    </header>

    <div id="chat-container">
        <div class="message nova" data-emotion="neutral">
            Hii! Mai online hoon. Kya chal raha hai? ✨
        </div>
        
        <div class="typing" id="typing-indicator">
            <span></span><span></span><span></span>
        </div>
    </div>

    <div class="input-area">
        <button class="action-btn mic" id="mic-btn">
            <i class="fa-solid fa-microphone"></i>
        </button>
        <input type="text" id="message-input" placeholder="Message NOVA..." autocomplete="off">
        <button class="action-btn" id="send-btn">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const micBtn = document.getElementById('mic-btn');
        const typingIndicator = document.getElementById('typing-indicator');
        const statusDot = document.getElementById('connection-status');
        
        let ws;
        let isConnecting = false;

        function connectWebSocket() {
            if (isConnecting || (ws && ws.readyState === WebSocket.OPEN)) return;
            isConnecting = true;
            
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                statusDot.classList.remove('disconnected');
                isConnecting = false;
                console.log("Connected to NOVA WS");
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                hideTyping();
                addNovaMessage(data.reply, data.emotion, window.lastUserQuestion);
            };
            
            ws.onclose = () => {
                statusDot.classList.add('disconnected');
                isConnecting = false;
                setTimeout(connectWebSocket, 3000); // Reconnect
            };
            
            ws.onerror = (error) => {
                console.error("WS Error:", error);
                ws.close();
            };
        }

        // Initialize connection
        connectWebSocket();

        function showTyping() {
            typingIndicator.style.display = 'flex';
            chatContainer.appendChild(typingIndicator); // move to bottom
            scrollToBottom();
        }

        function hideTyping() {
            typingIndicator.style.display = 'none';
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function addUserMessage(text) {
            const div = document.createElement('div');
            div.className = 'message user';
            div.textContent = text;
            chatContainer.appendChild(div);
            scrollToBottom();
            window.lastUserQuestion = text;
        }

        function addNovaMessage(text, emotion = 'neutral', relatedQuestion = '') {
            const div = document.createElement('div');
            div.className = 'message nova';
            div.setAttribute('data-emotion', emotion);
            div.textContent = text;
            
            // Add feedback buttons
            const feedbackDiv = document.createElement('div');
            feedbackDiv.className = 'feedback-actions';
            
            const upBtn = document.createElement('button');
            upBtn.className = 'feedback-btn';
            upBtn.innerHTML = '<i class="fa-solid fa-thumbs-up"></i>';
            upBtn.onclick = () => submitFeedback(relatedQuestion, text, 5, upBtn, downBtn);
            
            const downBtn = document.createElement('button');
            downBtn.className = 'feedback-btn';
            downBtn.innerHTML = '<i class="fa-solid fa-thumbs-down"></i>';
            downBtn.onclick = () => submitFeedback(relatedQuestion, text, 1, downBtn, upBtn);
            
            feedbackDiv.appendChild(upBtn);
            feedbackDiv.appendChild(downBtn);
            div.appendChild(feedbackDiv);

            chatContainer.appendChild(div);
            scrollToBottom();
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;
            
            addUserMessage(text);
            messageInput.value = '';
            showTyping();
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ message: text }));
            } else {
                // Fallback to HTTP if WS is dead
                fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ message: text })
                })
                .then(r => r.json())
                .then(data => {
                    hideTyping();
                    addNovaMessage(data.reply, data.emotion, text);
                })
                .catch(e => {
                    hideTyping();
                    addNovaMessage("Sorry bhai, network error lag raha hai.", "stressed");
                });
            }
        }

        async function submitFeedback(question, answer, rating, activeBtn, otherBtn) {
            if (!question) return;
            
            activeBtn.classList.add('active');
            otherBtn.classList.remove('active');
            
            try {
                await fetch('/feedback', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ question, answer, rating })
                });
            } catch (e) {
                console.error("Feedback failed:", e);
            }
        }

        // Event Listeners
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Speech Recognition
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';
            recognition.interimResults = false;
            
            recognition.onstart = () => {
                micBtn.classList.add('listening');
            };
            
            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                messageInput.value = text;
                sendMessage();
            };
            
            recognition.onend = () => {
                micBtn.classList.remove('listening');
            };
            
            micBtn.addEventListener('click', () => {
                if (micBtn.classList.contains('listening')) {
                    recognition.stop();
                } else {
                    recognition.start();
                }
            });
        } else {
            micBtn.style.display = 'none';
        }
    </script>
</body>
</html>
