version: '3.8'

services:
  db:
    image: postgres:15
    container_name: nova_postgres
    restart: always
    environment:
      POSTGRES_USER: nova_admin
      POSTGRES_PASSWORD: nova_password
      POSTGRES_DB: nova_db
    ports:
      - "5432:5432"
    volumes:
      - nova_pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: nova_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  nova_pgdata:
